# evix-store — production stack (self-hosted on the evix MSI server).
#
# Runs behind a Cloudflare Tunnel (TLS at the edge) — NO host ports are
# published; every service talks over the internal compose network. Secrets are
# interpolated from a sibling `.env` (chmod 600, NOT in git) — see
# `.env.prod.example`. The front image is built from the sibling checkout
# `../evix-store-front`.
#
# Deploy (on the server, from this repo root):
#   docker compose -f docker-compose.prod.yml up -d --build            # app + front
#   docker compose -f docker-compose.prod.yml --profile tunnel up -d   # + cloudflared
# The `migrate` one-off runs `alembic upgrade head` before `app` starts.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: evix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: evix_store
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evix -d evix_store']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Create the media bucket + make it public-read (idempotent, one-off).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/evix-media &&
      mc anonymous set download local/evix-media
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    restart: 'no'

  # Apply DB migrations as a separate pre-deploy step (app never migrates on boot).
  migrate:
    build: .
    command: ['uv', 'run', 'alembic', 'upgrade', 'head']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://evix:${POSTGRES_PASSWORD}@db:5432/evix_store
    restart: 'no'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &app_env
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://evix:${POSTGRES_PASSWORD}@db:5432/evix_store
      DB_POOL_SIZE: '20'
      DB_MAX_OVERFLOW: '10'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      CORS_ALLOW_ORIGINS: https://shop.evix.md
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: evix-media
      S3_PUBLIC_URL: https://media.evix.md/evix-media
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-orders@evix.md}
      CURRENCY: MDL
      DEFAULT_LANG: ro
      COURIER_RATE: ${COURIER_RATE:-50}
      RATE_LIMIT_LOGIN: 5/60
      RATE_LIMIT_CHECKOUT: 10/60
    # uvicorn --proxy-headers: trust X-Forwarded-* from Cloudflare (rate-limit
    # reads the real client IP). Multiple workers for prod load.
    command:
      [
        'uv',
        'run',
        'uvicorn',
        'app.main:app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--workers',
        '3',
        '--proxy-headers',
        '--forwarded-allow-ips',
        '*',
      ]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Celery worker — async tasks (restock notifications, …). Same image/env as
  # `app`; broker/backend = Redis DB /1. NullPool per-task engine (see
  # app/tasks/base.py) makes the prefork worker safe with async SQLAlchemy.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
    command:
      [
        'uv',
        'run',
        'celery',
        '-A',
        'app.core.celery_app',
        'worker',
        '--loglevel=info',
        '--concurrency',
        '2',
      ]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'uv run celery -A app.core.celery_app inspect ping -t 10 >/dev/null 2>&1 || exit 1',
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  # Celery Beat — single scheduler firing periodic tasks (restock sweep). MUST be
  # a single instance; the schedule DB lives in /tmp (ephemeral, schedule is
  # code-defined in celery_app.beat_schedule).
  beat:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app_env
    command:
      [
        'uv',
        'run',
        'celery',
        '-A',
        'app.core.celery_app',
        'beat',
        '--loglevel=info',
        '--schedule',
        '/tmp/celerybeat-schedule',
      ]

  front:
    build:
      context: ../evix-store-front
      args:
        PUBLIC_API_BASE: https://shop.evix.md
        SITE_URL: https://shop.evix.md
    restart: unless-stopped
    # SSR fetches the API internally (no edge hairpin); browser uses PUBLIC base.
    environment:
      API_INTERNAL_BASE: http://app:8000
      # Pre-launch: noindex meta + robots Disallow all. Set to false at launch.
      SITE_NOINDEX: 'true'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/ro').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Cloudflare Tunnel (edge TLS). Enable with `--profile tunnel`. Reads the
  # locally-managed tunnel config + credentials from the host ~/.cloudflared.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ['tunnel']
    user: '1000:1000'
    command: tunnel --no-autoupdate --config /etc/cloudflared/config-evix-store.yml run
    volumes:
      - /home/evix/.cloudflared:/etc/cloudflared:ro
    depends_on:
      front:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
