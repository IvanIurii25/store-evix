services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: evix
      POSTGRES_PASSWORD: evix
      POSTGRES_DB: evix_store
    ports:
      - "55432:5432"
    volumes:
      - evix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evix -d evix_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - evix_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: evixminio
      MINIO_ROOT_PASSWORD: evixminio-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - evix_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create the media bucket and make it public-read on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 evixminio evixminio-secret &&
      mc mb --ignore-existing local/evix-media &&
      mc anonymous set download local/evix-media
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "51025:1025"
      - "58025:8025"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://evix:evix@db:5432/evix_store
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "10"
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:59000/evix-media
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    ports:
      - "58000:8000"

volumes:
  evix_pgdata:
  evix_redisdata:
  evix_miniodata:
