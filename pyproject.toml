[project]
name = "evix-store"
version = "0.1.0"
description = "evix-store backend — single-tenant e-commerce core (FastAPI + async SQLAlchemy 2.0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "orjson>=3.10.0",
    "pyjwt>=2.13.0",
    "argon2-cffi>=25.1.0",
    "redis[hiredis]>=8.0.1",
    "python-multipart>=0.0.32",
    "aioboto3>=15.5.0",
    "aiosmtplib>=5.1.2",
    "pillow>=12.3.0",
    "celery[redis]>=5.3.1",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.0",
    "pre-commit>=4.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Collect both the default ``Test*`` prefix and the methodology guide's
# ``<Resource><Action>Test`` suffix convention so either naming form runs.
python_classes = ["Test*", "*Test"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# Line length is owned by the formatter (ruff format), not the linter.
# UP042/UP046/UP047: StrEnum & PEP-695 generics — stylistic rewrites of working,
# tested code with subtle behaviour deltas (StrEnum __str__); not adopted.
ignore = ["E501", "UP042", "UP046", "UP047"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/SQLAlchemy patterns that legitimately call in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Form", "fastapi.File", "fastapi.Header",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Lines that are legitimately unreachable or defensive are excluded from the
# denominator (rather than tested for the sake of a number). Keep this list
# tight — prefer a real test over a blanket pragma.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
    "@(abc\\.)?abstractmethod",
]
